<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Fundi QR</title>
  <meta name="theme-color" content="#090d16" />
  
  <!-- App Icon on Home Screen -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23059669'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900' font-size='38'>QR</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23059669'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900' font-size='38'>QR</text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090d16;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: #f9fafb;
    }
    p {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 24px;
    }
    .qr-card {
      background: #ffffff;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: inline-block;
      max-width: 320px;
      width: 100%;
    }
    .qr-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <span class="badge">Solutions Desk</span>
  <h1>FundiPocket Instant Pass</h1>
  <p>Scan with any phone camera to launch</p>

  <div class="qr-card">
    <img 
      src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https%3A%2F%2Ffundipocket.marcdiedricks.workers.dev%2Flanding.html" 
      alt="FundiPocket QR Code" 
    />
  </div>

  <div class="footer-note">
    Offline-First • Low-Bandwidth Infrastructure
  </div>
</body>
</html>
