name: FundiPocket Distinctive PWA Gate
on:
  push:
    branches: [work/distinctive-pwa-v1-20261124]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and syntax-check JavaScript
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); js=s.rsplit('<script>',1)[1].split('</script>',1)[0]; Path('/tmp/fundi.js').write_text(js)"
          node --check /tmp/fundi.js
      - name: Verify core learning loop and no forbidden taxonomy
        run: |
          grep -q "function buildLearningPack" index.html
          grep -q "function makeOfflineSummary" index.html
          grep -q "function makeKnowledgeCheck" index.html
          grep -q "function saveActiveLesson" index.html
          grep -q "function toggleAudioRecording" index.html
          grep -q "function handlePhotoCapture" index.html
          ! grep -qi "Agriculture" index.html
          ! grep -qi "Artisan" index.html
      - name: Verify five-language runtime coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['en','af','xh','zu','nso']
          for block in ['uiTranslations','systemTranslations','runtimeMessages']:
              start=s.index('const '+block+'=')
              end=s.index('\n};',start)+3
              body=s[start:end]
              missing=[lang for lang in required if not re.search(r'(?m)^'+re.escape(lang)+r':\{',body)]
              assert not missing, f'{block} missing languages: {missing}'
          forbidden=[
            "alert('FundiPocket could not open local storage",
            "alert('You can attach up to 5 photos",
            "alert('Audio recording is not supported",
            "input.placeholder='Your answer'",
            "Excellent — you explained, remembered and applied",
            "Good understanding — ",
            "Keep learning — use the summary",
            "alert('Library backup restored",
            "alert('Restore failed",
            "alert('This shared learning could not be imported"
          ]
          runtime_start=s.index('const runtimeMessages=')
          runtime_end=s.index('const systemTranslations=',runtime_start)
          executable=s[:runtime_start]+s[runtime_end:]
          found=[x for x in forbidden if x in executable]
          assert not found, 'Hard-coded English learner strings remain outside translation resources: '+repr(found)
          sw=Path('sw.js').read_text()
          assert 'fundipocket-distinctive-v7' not in sw, 'stale V7 cache identity remains'
          print('PASS: five-language runtime coverage and cache identity')
          PY
      - name: Verify PWA shell files
        run: |
          test -s manifest.json
          test -s sw.js
          grep -q "serviceWorker.register" index.html
