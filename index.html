<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FundiPocket — Offline Student Toolkit</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    /* DYNAMIC THEME PALETTES */
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-alt: #0b1329;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --input-bg: #0f172a;
      --accent: #10b981;
      --accent-hover: #059669;
      --highlight: #2563eb;
      --danger: #ef4444;
      --modal-bg: #0b1120;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-alt: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --input-bg: #ffffff;
      --accent: #059669;
      --accent-hover: #047857;
      --highlight: #1d4ed8;
      --danger: #dc2626;
      --modal-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; transition: background 0.2s ease, color 0.2s ease; }
    .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 16px; }

    /* HEADER */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .brand h1 { font-size: 1.4rem; color: var(--accent); font-weight: 800; }
    .brand p { font-size: 0.75rem; color: var(--text-muted); }
    
    .theme-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* TELEMETRY & IMPORT */
    .telemetry-card {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-quota { color: var(--accent); font-weight: 700; }

    .import-btn-label {
      background: var(--highlight);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      display: block;
    }

    /* CARDS & INPUTS */
    .card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card h2 { font-size: 1.05rem; color: var(--text); display: flex; align-items: center; gap: 8px; }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    textarea { resize: vertical; min-height: 70px; }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-photo { background: #475569; color: white; }
    .btn-audio { background: #b91c1c; color: white; }
    .btn-audio.recording { background: #ef4444; animation: pulse 1.2s infinite; }
    .btn-save { background: var(--accent); color: white; width: 100%; padding: 12px; font-size: 0.95rem; }
    .btn-save:hover { background: var(--accent-hover); }

    /* LESSON CARDS */
    .lesson-card {
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lesson-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .faculty-tag { background: #0284c7; color: white; padding: 2px 8px; border-radius: 12px; font-weight: 600; font-size: 0.7rem; }
    .lesson-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .lesson-actions { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 6px; margin-top: 6px; }
    .btn-action { padding: 6px 8px; font-size: 0.75rem; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-read { background: var(--accent); color: white; }
    .btn-share { background: #8b5cf6; color: white; }
    .btn-download { background: var(--highlight); color: white; }
    .btn-delete { background: #334155; color: #fca5a5; }

    /* FULLSCREEN STUDY MODAL */
    #studyModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--modal-bg);
      z-index: 99999;
      padding: 20px 16px;
      overflow-y: auto;
      flex-direction: column;
      gap: 16px;
    }
    #studyModal.open { display: flex; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .modal-close { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER WITH THEME SWITCH -->
    <header>
      <div class="brand">
        <h1>FundiPocket</h1>
        <p>Offline Tertiary Knowledge Hub • Zero-Data PWA</p>
      </div>
      <button class="theme-btn" id="themeToggleBtn" onclick="toggleAppTheme()">
        🌙 Dark
      </button>
    </header>

    <!-- STORAGE TELEMETRY & IMPORT -->
    <div class="telemetry-card">
      <div>Storage Pool: <span class="badge-quota" id="storageUsage">0.0 MB</span></div>
      <div>Safe Quota: <span class="badge-quota" id="storageQuota">10240 MB</span></div>
    </div>

    <label class="import-btn-label">
      📥 Import Shared Lesson (.html)
      <input type="file" accept=".html,text/html" id="importFileInput" style="display:none;" onchange="importSharedLesson(event)">
    </label>

    <!-- CAPTURE FORM -->
    <section class="card">
      <h2>✍️ Capture Lecture Unit</h2>
      
      <select id="facultySelect">
        <option value="General Studies">General Studies / All Faculties</option>
        <option value="Engineering & Built Environment">Engineering & Built Environment</option>
        <option value="Law & Legal Studies">Law & Legal Studies</option>
        <option value="Commerce & Management">Commerce & Management</option>
        <option value="Humanities & Social Sciences">Humanities & Social Sciences</option>
        <option value="Health Sciences">Health Sciences</option>
        <option value="Science & Technology">Science & Technology</option>
      </select>

      <input type="text" id="lessonTitle" placeholder="Lecture Topic / Code (e.g. Contract Law 101)">
      <textarea id="lessonNotes" placeholder="Key formulas, whiteboard summary, or lecturer notes..."></textarea>

      <div class="btn-grid">
        <label class="btn btn-photo">
          📷 Snap Slide/Board
          <input type="file" accept="image/*" capture="environment" id="photoCaptureInput" style="display:none;" onchange="handlePhotoCapture(event)">
        </label>
        <button class="btn btn-audio" id="audioRecordBtn" onclick="toggleAudioRecording()">
          🎙️ Record Audio
        </button>
      </div>

      <div id="captureSummary" style="font-size:0.75rem; color:var(--text-muted);">
        Photos queued: <span id="photoCountBadge">0</span> | Audio: <span id="audioStatusBadge">None</span>
      </div>

      <button class="btn btn-save" onclick="saveActiveLesson()">💾 Save Lesson to Local Library</button>
    </section>

    <!-- SAVED LESSONS & SEARCH -->
    <section class="card">
      <h2>📚 Saved Lessons Library</h2>
      <input type="text" id="searchInput" placeholder="🔍 Search topic, formula, or faculty..." oninput="filterLessons()">
      <div id="lessonsList" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Dynamic Cards -->
      </div>
    </section>
  </div>

  <!-- FULLSCREEN STUDY READER MODAL -->
  <div id="studyModal">
    <div class="modal-header">
      <span class="faculty-tag" id="modalFaculty">Faculty</span>
      <button class="modal-close" onclick="closeStudyModal()">✕ Close</button>
    </div>
    <h1 class="lesson-title" id="modalTitle" style="font-size:1.4rem;">Lecture Title</h1>
    <div style="font-size:0.8rem; color:var(--text-muted);" id="modalDate">Captured Date</div>
    <div id="modalAudioSection"></div>
    <div class="card" style="margin-top:8px;">
      <h3 style="font-size:0.95rem; color:var(--accent);">Whiteboard Slides</h3>
      <div id="modalImagesContainer" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
    <div class="card">
      <h3 style="font-size:0.95rem; color:var(--accent);">Notes & Formulas</h3>
      <p id="modalNotesText" style="font-size:0.95rem; line-height:1.6; white-space:pre-wrap;"></p>
    </div>
  </div>

  <script>
    /* THEME SWITCHER ENGINE */
    function initTheme() {
      const saved = localStorage.getItem('fundi_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeButtonLabel(saved);
    }
    function toggleAppTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('fundi_theme', next);
      updateThemeButtonLabel(next);
    }
    function updateThemeButtonLabel(theme) {
      const btn = document.getElementById('themeToggleBtn');
      if (!btn) return;
      btn.innerHTML = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }
    initTheme();

    /* INDEXEDDB STORAGE */
    let db;
    let queuedPhotos = [];
    let recordedAudioBlob = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let allLessonsCache = [];

    const dbReq = indexedDB.open("FundiPocketDB", 2);
    dbReq.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("lessons")) {
        db.createObjectStore("lessons", { keyPath: "id", autoIncrement: true });
      }
    };
    dbReq.onsuccess = (e) => {
      db = e.target.result;
      refreshTelemetry();
      loadLessons();
    };

    /* STORAGE ESTIMATION */
    async function refreshTelemetry() {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        const used = (est.usage / (1024 * 1024)).toFixed(1);
        const quota = (est.quota / (1024 * 1024)).toFixed(0);
        document.getElementById('storageUsage').textContent = used + ' MB';
        document.getElementById('storageQuota').textContent = quota + ' MB';
      }
    }

    /* PHOTO CAPTURE & COMPRESSION */
    function handlePhotoCapture(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const v = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
            d[i] = d[i+1] = d[i+2] = v > 125 ? 255 : (v < 90 ? 0 : v);
          }
          ctx.putImageData(imgData, 0, 0);
          canvas.toBlob((blob) => {
            queuedPhotos.push(blob);
            document.getElementById('photoCountBadge').textContent = queuedPhotos.length;
          }, 'image/webp', 0.65);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* AUDIO CAPTURE */
    async function toggleAudioRecording() {
      const btn = document.getElementById('audioRecordBtn');
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        btn.classList.remove('recording');
        btn.textContent = '🎙️ Record Audio';
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 16000 });
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          document.getElementById('audioStatusBadge').textContent = `${(recordedAudioBlob.size / 1024).toFixed(0)} KB ready`;
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        btn.classList.add('recording');
        btn.textContent = '⏹️ Stop Recording';
      } catch (err) {
        alert('Microphone access required for audio capture.');
      }
    }

    /* SAVE LESSON */
    function saveActiveLesson() {
      const title = document.getElementById('lessonTitle').value.trim() || 'Untitled Lecture';
      const faculty = document.getElementById('facultySelect').value;
      const notes = document.getElementById('lessonNotes').value.trim();
      const record = {
        title, faculty, notes,
        photos: queuedPhotos,
        audio: recordedAudioBlob,
        date: new Date().toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      };
      const tx = db.transaction('lessons', 'readwrite');
      tx.objectStore('lessons').add(record);
      tx.oncomplete = () => {
        queuedPhotos = [];
        recordedAudioBlob = null;
        document.getElementById('lessonTitle').value = '';
        document.getElementById('lessonNotes').value = '';
        document.getElementById('photoCountBadge').textContent = '0';
        document.getElementById('audioStatusBadge').textContent = 'None';
        refreshTelemetry();
        loadLessons();
      };
    }

    /* LOAD & DISPLAY */
    function loadLessons() {
      const tx = db.transaction('lessons', 'readonly');
      const req = tx.objectStore('lessons').getAll();
      req.onsuccess = () => {
        allLessonsCache = req.result || [];
        renderLessons(allLessonsCache);
      };
    }

    function renderLessons(list) {
      const container = document.getElementById('lessonsList');
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<div style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:16px;">No lessons found in this view.</div>';
        return;
      }
      list.forEach(l => {
        const div = document.createElement('div');
        div.className = 'lesson-card';
        div.innerHTML = `
          <div class="lesson-meta">
            <span class="faculty-tag">${l.faculty}</span>
            <span style="color:var(--text-muted); font-size:0.75rem;">${l.date}</span>
          </div>
          <div class="lesson-title">${l.title}</div>
          <div style="font-size:0.78rem; color:var(--text-muted);">${(l.notes || '').substring(0, 75)}...</div>
          <div class="lesson-actions">
            <button class="btn-action btn-read" onclick="openStudyModal(${l.id})">📖 Study</button>
            <button class="btn-action btn-share" onclick="shareLessonBundle(${l.id})">📲 Share</button>
            <button class="btn-action btn-download" onclick="downloadLessonBundle(${l.id})">⬇️ Save</button>
            <button class="btn-action btn-delete" onclick="deleteLesson(${l.id})">🗑️</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function filterLessons() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allLessonsCache.filter(l => 
        l.title.toLowerCase().includes(q) ||
        l.faculty.toLowerCase().includes(q) ||
        (l.notes && l.notes.toLowerCase().includes(q))
      );
      renderLessons(filtered);
    }

    /* MODAL */
    function openStudyModal(id) {
      const lesson = allLessonsCache.find(l => l.id === Number(id));
      if (!lesson) return;
      document.getElementById('modalFaculty').textContent = lesson.faculty;
      document.getElementById('modalTitle').textContent = lesson.title;
      document.getElementById('modalDate').textContent = 'Captured: ' + lesson.date;
      document.getElementById('modalNotesText').textContent = lesson.notes || 'No written notes recorded.';

      const audioSec = document.getElementById('modalAudioSection');
      audioSec.innerHTML = '';
      if (lesson.audio) {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.style.width = '100%';
        audio.src = URL.createObjectURL(lesson.audio);
        audioSec.appendChild(audio);
      }

      const imgSec = document.getElementById('modalImagesContainer');
      imgSec.innerHTML = '';
      if (lesson.photos && lesson.photos.length > 0) {
        lesson.photos.forEach(p => {
          const img = document.createElement('img');
          img.style.width = '100%';
          img.style.borderRadius = '6px';
          img.style.border = '1px solid var(--border)';
          img.src = URL.createObjectURL(p);
          imgSec.appendChild(img);
        });
      } else {
        imgSec.innerHTML = '<span style="font-size:0.8rem; color:var(--text-muted);">No chalkboard photos attached.</span>';
      }
      document.getElementById('studyModal').classList.add('open');
    }
    function closeStudyModal() {
      document.getElementById('studyModal').classList.remove('open');
    }

    /* DELETE */
    function deleteLesson(id) {
      if (!confirm('Permanently delete this lesson unit from your device storage?')) return;
      const tx = db.transaction('lessons', 'readwrite');
      tx.objectStore('lessons').delete(Number(id));
      tx.oncomplete = () => {
        refreshTelemetry();
        loadLessons();
      };
    }

    /* EXPORT & SHARE */
    async function buildStandaloneHTML(lesson) {
      const photoPromises = (lesson.photos || []).map(p => new Promise(res => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.readAsDataURL(p);
      }));
      const b64Photos = await Promise.all(photoPromises);

      let b64Audio = '';
      if (lesson.audio) {
        b64Audio = await new Promise(res => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.readAsDataURL(lesson.audio);
        });
      }

      return `<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${lesson.title}</title><style>body{background:#0f172a;color:#f8fafc;padding:16px;font-family:sans-serif;max-width:600px;margin:auto}.card{background:#1e293b;padding:16px;border-radius:8px;border:1px solid #334155;margin-bottom:14px}h1{color:#10b981;font-size:1.3rem}img{width:100%;border-radius:6px;margin-top:8px}audio{width:100%;margin-top:10px}</style></head><body><div class="card"><span style="background:#0284c7;color:white;padding:2px 8px;border-radius:12px;font-size:0.75rem">${lesson.faculty}</span><h1>${lesson.title}</h1><p style="font-size:0.8rem;color:#94a3b8">${lesson.date}</p>${b64Audio ? `<audio controls src="${b64Audio}"></audio>` : ''}</div><div class="card"><h3>Notes</h3><p style="white-space:pre-wrap;font-size:0.9rem">${lesson.notes}</p></div><div class="card"><h3>Board Photos</h3>${b64Photos.map(src => `<img src="${src}">`).join('')}</div><footer style="text-align:center;font-size:0.75rem;color:#94a3b8">Captured via FundiPocket • Offline Tertiary Study Toolkit • fundipocket.marcdiedricks.workers.dev</footer></body></html>`;
    }

    async function downloadLessonBundle(id) {
      const lesson = allLessonsCache.find(l => l.id === Number(id));
      if (!lesson) return;
      const html = await buildStandaloneHTML(lesson);
      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${lesson.title.replace(/[^a-zA-Z0-9]/g, '_')}_lesson.html`;
      a.click();
    }

    async function shareLessonBundle(id) {
      const lesson = allLessonsCache.find(l => l.id === Number(id));
      if (!lesson) return;
      const html = await buildStandaloneHTML(lesson);
      const file = new File([html], `${lesson.title.replace(/[^a-zA-Z0-9]/g, '_')}_lesson.html`, { type: 'text/html' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: lesson.title, text: 'Here is our offline lecture bundle from FundiPocket.' });
      } else {
        downloadLessonBundle(id);
      }
    }

    /* IMPORT LESSON */
    function importSharedLesson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const doc = new DOMParser().parseFromString(e.target.result, 'text/html');
        const title = (doc.querySelector('h1') ? doc.querySelector('h1').textContent : 'Imported Lesson').trim();
        const faculty = (doc.querySelector('span') ? doc.querySelector('span').textContent : 'General Studies').trim();
        const notes = (doc.querySelectorAll('.card p')[1] ? doc.querySelectorAll('.card p')[1].textContent : '').trim();
        
        const tx = db.transaction('lessons', 'readwrite');
        tx.objectStore('lessons').add({
          title: title + ' (Imported)',
          faculty,
          notes,
          photos: [],
          audio: null,
          date: new Date().toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        });
        tx.oncomplete = () => {
          alert(`Successfully imported: ${title}`);
          refreshTelemetry();
          loadLessons();
        };
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
